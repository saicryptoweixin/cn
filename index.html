<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet Deposit Tracker</title>
<style>
body{font:16px system-ui,sans-serif;max-width:560px;margin:auto;padding:16px;background:#111;color:#eee}
input,button{width:100%;padding:10px;margin:4px 0;font-size:16px;box-sizing:border-box;border-radius:6px;border:1px solid #333;background:#1c1c1c;color:#eee}
button{background:#2563eb;border:0;cursor:pointer}
.c{background:#1c1c1c;padding:12px;border-radius:8px;margin:10px 0;word-break:break-all}
.RECEIVED{color:#4ade80}.WAITING{color:#94a3b8}
a{color:#7dd3fc}small{color:#94a3b8}
</style>
</head>
<body>
<div id="app"></div>
<script>
const USDT='TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const app=document.getElementById('app');
const enc=o=>btoa(encodeURIComponent(JSON.stringify(o)));
const dec=s=>JSON.parse(decodeURIComponent(atob(s)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function form(){
  app.innerHTML=`<h2>Create deposit tracker</h2>
  <input id="n" placeholder="Name (optional)">
  <input id="w" placeholder="Your TRON wallet (starts with T)">
  <input id="f" placeholder="Only count deposits from this sender wallet (optional)">
  <button id="go">Create link</button><div id="out"></div>
  <small>Tracks confirmed USDT (TRC20) deposits arriving in your wallet after the link is created. Nothing else.</small>`;
  document.getElementById('go').onclick=()=>{
    const w=document.getElementById('w').value.trim();
    if(!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(w))return alert('Enter a valid TRON wallet');
    const d={n:document.getElementById('n').value||'Deposits',w,f:document.getElementById('f').value.trim(),t:Date.now()};
    const url=location.origin+location.pathname+'#'+enc(d);
    document.getElementById('out').innerHTML=`<div class="c">Share this link:<br><a href="${url}">${url}</a></div>
    <button onclick="navigator.clipboard.writeText('${url}');this.textContent='Copied'">Copy link</button>`;
  };
}

function status(d){
  app.innerHTML='<h2>Deposit status</h2><div id="o" class="c">Loading…</div><small>Refreshes every 20s. <a href="#" id="new">Create new link</a></small>';
  document.getElementById('new').onclick=e=>{e.preventDefault();history.pushState('','',location.pathname);form();};
  const o=document.getElementById('o');
  async function load(){
    try{
      const r=await fetch(`https://api.trongrid.io/v1/accounts/${d.w}/transactions/trc20?only_to=true&only_confirmed=true&limit=200&min_timestamp=${d.t}&contract_address=${USDT}`);
      const j=await r.json();
      const txs=(j.data||[]).filter(t=>t.token_info&&t.token_info.address===USDT&&t.to===d.w&&(!d.f||t.from===d.f))
        .map(t=>({id:t.transaction_id,from:t.from,amt:Number(t.value)/10**(t.token_info.decimals??6),time:t.block_timestamp}));
      const got=txs.reduce((s,t)=>s+t.amt,0), st=txs.length?'RECEIVED':'WAITING';
      o.innerHTML=`<b>${esc(d.n)}</b><br>Wallet: <code>${esc(d.w)}</code><br>Network: TRON (TRC20) USDT<br>
      Status: <b class="${st}">${st}</b><br>Total received in wallet: <b>${got}</b> USDT
      ${txs.map(t=>`<br>✔ ${t.amt} USDT from ${esc(t.from.slice(0,8))}… · ${new Date(t.time).toLocaleString()} · <a href="https://tronscan.org/#/transaction/${t.id}" target="_blank">tx</a>`).join('')}`;
    }catch(err){o.textContent='Could not reach the blockchain API, retrying…';}
  }
  load();setInterval(load,20000);
}
(function(){const h=location.hash.slice(1);if(!h)return form();try{status(dec(h));}catch{form();}})();
</script>
</body>
</html>
