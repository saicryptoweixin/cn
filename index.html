<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT Payment Tracker</title>
<style>
body{font:16px system-ui,sans-serif;max-width:560px;margin:auto;padding:16px;background:#111;color:#eee}
input,button{width:100%;padding:10px;margin:4px 0;font-size:16px;box-sizing:border-box;border-radius:6px;border:1px solid #333;background:#1c1c1c;color:#eee}
button{background:#2563eb;border:0;cursor:pointer}
.c{background:#1c1c1c;padding:12px;border-radius:8px;margin:10px 0;word-break:break-all}
.CONFIRMED{color:#4ade80}.PARTIAL{color:#fbbf24}.WAITING{color:#94a3b8}
a{color:#7dd3fc}small{color:#94a3b8}
</style>
</head>
<body>
<div id="app"></div>
<script>
const USDT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const app = document.getElementById('app');
const enc = o => btoa(encodeURIComponent(JSON.stringify(o)));
const dec = s => JSON.parse(decodeURIComponent(atob(s)));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function form() {
  app.innerHTML = `<h2>Create payment link</h2>
  <input id="n" placeholder="Deal name">
  <input id="w" placeholder="Your TRON wallet (starts with T)">
  <input id="e" type="number" step="any" placeholder="Expected USDT amount">
  <input id="p" type="number" step="any" value="10" placeholder="Your commission %">
  <input id="f" placeholder="Sender's wallet (optional, recommended)">
  <button id="go">Create link</button>
  <div id="out"></div>
  <small>Network: TRON (TRC20) USDT only. Only transfers made after the link is created are counted.</small>`;
  document.getElementById('go').onclick = () => {
    const w = document.getElementById('w').value.trim(), e = +document.getElementById('e').value;
    if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(w) || !(e > 0)) return alert('Enter a valid TRON wallet and amount');
    const d = { n: document.getElementById('n').value || 'Deal', w, e, p: +document.getElementById('p').value || 10,
      f: document.getElementById('f').value.trim(), t: Date.now() };
    const url = location.origin + location.pathname + '#' + enc(d);
    document.getElementById('out').innerHTML = `<div class="c">Share this link:<br><a href="${url}">${url}</a></div>
      <button onclick="navigator.clipboard.writeText('${url}');this.textContent='Copied'">Copy link</button>`;
  };
}

async function status(d) {
  app.innerHTML = '<h2>Payment status</h2><div id="o" class="c">Loading…</div><small>Auto-refreshes every 20s. <a href="#" id="new">Create new link</a></small>';
  document.getElementById('new').onclick = e => { e.preventDefault(); history.pushState('', '', location.pathname); form(); };
  const o = document.getElementById('o');
  async function load() {
    try {
      const r = await fetch(`https://api.trongrid.io/v1/accounts/${d.w}/transactions/trc20?only_to=true&only_confirmed=true&limit=200&min_timestamp=${d.t}&contract_address=${USDT}`);
      const j = await r.json();
      const txs = (j.data || []).filter(t => t.token_info && t.token_info.address === USDT && t.to === d.w && (!d.f || t.from === d.f))
        .map(t => ({ id: t.transaction_id, from: t.from, amt: Number(t.value) / 10 ** (t.token_info.decimals ?? 6) }));
      const got = txs.reduce((s, t) => s + t.amt, 0);
      const st = got >= d.e * 0.999 ? 'CONFIRMED' : got > 0 ? 'PARTIAL' : 'WAITING';
      o.innerHTML = `<b>${esc(d.n)}</b><br>Status: <b class="${st}">${st}</b><br>
        Send <b>${d.e} USDT</b> on <b>TRON (TRC20)</b> to:<br><code>${esc(d.w)}</code><br>
        Received: <b>${got}</b> USDT<br>Commission (${d.p}%): ${(d.e * d.p / 100).toFixed(2)} USDT
        ${txs.map(t => `<br>✔ ${t.amt} from ${esc(t.from.slice(0, 8))}… <a href="https://tronscan.org/#/transaction/${t.id}" target="_blank">tx</a>`).join('')}`;
    } catch (err) { o.textContent = 'Could not reach the blockchain API, retrying…'; }
  }
  load(); setInterval(load, 20000);
}

function route() {
  const h = location.hash.slice(1);
  if (!h) return form();
  try { status(dec(h)); } catch { form(); }
}
route();
</script>
</body>
</html>
